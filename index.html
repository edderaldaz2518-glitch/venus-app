  <meta
    name="description"
    content="VenuS — conecta, descubre y comparte."
  />  <title>VenuS</title>  <link rel="stylesheet" href="style.css" />  <!-- Supabase -->  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script>

  </script></head><body>  <div id="app"><!-- =========================
     HEADER
========================== -->

<header class="topbar">

  <div class="brand">
    <div class="brand-icon">V</div>
    <span>VenuS</span>
  </div>

  <div class="top-actions">

    <button
      class="icon-button"
      id="searchBtn"
      aria-label="Buscar"
    >
      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5"></circle>
        <path d="M16 16L21 21"></path>
      </svg>
    </button>

    <button
      class="icon-button"
      id="filterBtn"
      aria-label="Filtros"
    >
      <svg viewBox="0 0 24 24">
        <path d="M4 7h16"></path>
        <path d="M7 12h10"></path>
        <path d="M10 17h4"></path>
      </svg>
    </button>

  </div>

</header>


<!-- =========================
     UBICACIÓN
========================== -->

<section class="location-bar">

  <div class="location-info">

    <span class="status-dot"></span>

    <div>
      <small>DESCUBRIENDO CERCA DE TI</small>
      <strong id="locationText">
        Personas cercanas
      </strong>
    </div>

  </div>

  <button class="nearby-button">
    Cerca de ti
    <span>⌄</span>
  </button>

</section>


<!-- =========================
     FILTROS RÁPIDOS
========================== -->

<div class="filter-chips">

  <button class="chip active">
    Todos
  </button>

  <button class="chip">
    Activos
  </button>

  <button class="chip">
    Nuevos
  </button>

  <button class="chip">
    Populares
  </button>

</div>


<!-- =========================
     PERFILES
========================== -->

<main>

  <div
    id="profilesGrid"
    class="profiles-grid"
  >

    <div class="loading-card">

      <div class="loading-spinner"></div>

      <span>
        Cargando perfiles...
      </span>

    </div>

  </div>

</main>


<!-- =========================
     NAVEGACIÓN
========================== -->

<nav class="bottom-nav">

  <button
    class="nav-item active"
    data-page="home"
  >

    <svg viewBox="0 0 24 24">
      <path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"></path>
      <path d="M9 21v-6h6v6"></path>
    </svg>

    <span>
      Descubrir
    </span>

  </button>


  <button
    class="nav-item"
    data-page="messages"
  >

    <svg viewBox="0 0 24 24">
      <path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.4 8.4 0 0 1-3.2-.6L4 20l1.5-4.2A7.3 7.3 0 0 1 4.5 12 7.5 7.5 0 0 1 12 4.5a7.5 7.5 0 0 1 8 7z"></path>
    </svg>

    <span>
      Mensajes
    </span>

    <span
      class="notification-badge hidden"
      id="messageBadge"
    >
      0
    </span>

  </button>


  <button
    class="create-button"
    id="createBtn"
    aria-label="Crear publicación"
  >
    <span>+</span>
  </button>


  <button
    class="nav-item"
    data-page="posts"
  >

    <svg viewBox="0 0 24 24">
      <path d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"></path>
      <path d="M8 8h8"></path>
      <path d="M8 12h8"></path>
      <path d="M8 16h5"></path>
    </svg>

    <span>
      Publicaciones
    </span>

  </button>


  <button
    class="nav-item"
    data-page="profile"
  >

    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="3.5"></circle>
      <path d="M5 20c.7-3.7 3.1-5.7 7-5.7s6.3 2 7 5.7"></path>
    </svg>

    <span>
      Perfil
    </span>

  </button>

</nav>

  </div>  <!-- =========================
       MODAL PERFIL
  ========================== -->  <div
    class="modal-overlay hidden"
    id="profileModal"
  ><div class="profile-modal">

  <button
    class="modal-close"
    id="closeProfile"
  >
    ×
  </button>

  <div class="modal-photo">

    <img
      id="modalPhoto"
      src=""
      alt="Perfil"
    />

  </div>

  <div class="modal-content">

    <div class="modal-name-row">

      <div>

        <h2 id="modalName">
          Usuario
        </h2>

        <p id="modalMeta">
          Cerca de ti
        </p>

      </div>

      <span class="online-label">
        ● Activo
      </span>

    </div>

    <p
      id="modalBio"
      class="modal-bio"
    >
      Sin descripción.
    </p>

    <button class="primary-action">
      Ver perfil
    </button>

    <button class="secondary-action">
      Enviar mensaje
    </button>

  </div>

</div>

  </div>  <!-- =========================
       MODAL FILTROS
  ========================== -->  <div
    class="modal-overlay hidden"
    id="filterModal"
  ><div class="filter-modal">

  <div class="filter-header">

    <h2>
      Filtros
    </h2>

    <button id="closeFilters">
      ×
    </button>

  </div>


  <div class="filter-section">

    <label>
      Edad
    </label>

    <div class="range-row">
      <span>18</span>
      <span>60+</span>
    </div>

    <input
      type="range"
      min="18"
      max="60"
      value="40"
      id="ageFilter"
    />

  </div>


  <div class="filter-section">

    <label>
      Distancia
    </label>

    <div class="distance-options">

      <button class="distance-option active">
        5 km
      </button>

      <button class="distance-option">
        10 km
      </button>

      <button class="distance-option">
        25 km
      </button>

      <button class="distance-option">
        50 km
      </button>

    </div>

  </div>


  <button class="apply-filters">
    Aplicar filtros
  </button>

</div>

  </div>  <!-- =========================
       JAVASCRIPT DE LA APP
  ========================== -->  <script src="app.js"></script></body>
</html>
